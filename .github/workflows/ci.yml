name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Runs unit tests and the Testcontainers tests (Ubuntu runners have Docker)
      - name: Build and test
        run: ./mvnw -B verify
      # Coverage table on the run's summary page, plus the full HTML report as a downloadable artifact
      - name: Coverage summary
        run: python3 .github/scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
      # A broken Dockerfile fails the build too
      - name: Build Docker image
        run: docker build -t bookmyseat:ci .
      # Continuous deployment: only after everything above is green, and only for pushes to main.
      # Skipped (not failed) when the RENDER_DEPLOY_HOOK_URL secret isn't set, e.g. on forks.
      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set, skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered"
